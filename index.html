```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <title>水電材料估價單</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="material-manager">

        <h2>材料管理</h2>


        <input
            type="text"
            id="materialName"
            placeholder="材料名稱"
        >


        <input
            type="text"
            id="materialSpec"
            placeholder="規格"
        >


        <input
            type="number"
            id="materialPrice"
            placeholder="單價"
        >


        <button id="saveMaterial">
            儲存材料
        </button>

    </div>


    <!-- 工程基本資料 -->

    <div class="info">

        <label>

            工程名稱：

            <input
                type="text"
                id="projectName"
            >

        </label>


        <label>

            日期：

            <input
                type="date"
                id="projectDate"
            >

        </label>


        <label>

            地址：

            <input
                type="text"
                id="projectAddress"
                placeholder="請輸入工程地址"
            >

        </label>

    </div>


    <table>

        <thead>

            <tr>

                <!-- 材料使用日期 -->

                <th>
                    日期
                </th>


                <!-- 品名 -->

                <th>
                    品名
                </th>


                <th>
                    規格
                </th>


                <th>
                    數量
                </th>


                <th>
                    單價
                </th>


                <th>
                    金額
                </th>


                <th>
                    備註
                </th>


                <th class="operation-column">
                    操作
                </th>

            </tr>

        </thead>


        <tbody id="materialTable">

            <tr>


                <!-- =========================
                     材料日期
                     ========================= -->

                <td>

                    <input
                        type="date"
                        class="materialDate"
                    >

                </td>


                <!-- =========================
                     品名
                     ========================= -->

                <td style="position: relative;">

                    <input
                        type="text"
                        class="name"
                    >


                    <div class="materialSuggestions"></div>

                </td>


                <!-- =========================
                     規格
                     ========================= -->

                <td>

                    <input
                        type="text"
                        class="spec"
                    >

                </td>


                <!-- =========================
                     數量
                     ========================= -->

                <td>

                    <input
                        type="number"
                        class="quantity"
                    >

                </td>


                <!-- =========================
                     單價
                     ========================= -->

                <td>

                    <input
                        type="number"
                        class="price"
                    >

                </td>


                <!-- =========================
                     金額
                     ========================= -->

                <td>

                    <input
                        type="number"
                        class="amount"
                        readonly
                    >

                </td>


                <!-- =========================
                     備註
                     ========================= -->

                <td>

                    <input
                        type="text"
                        class="remark"
                    >

                </td>


                <!-- =========================
                     操作
                     ========================= -->

                <td class="operation-column">

                    <button class="deleteRow">
                        刪除
                    </button>

                </td>


            </tr>

        </tbody>

    </table>


    <!-- 新增材料 -->

    <button id="addRow">
        ＋ 新增材料
    </button>


    <!-- 儲存目前估價單 -->

    <button id="saveQuotation">
        💾 儲存估價單
    </button>


    <!-- 匯出 PDF -->

    <button id="printQuotation">
        匯出 PDF
    </button>


    <h2>

        合計：

        <span id="totalAmount">
            0
        </span>

        元

    </h2>


    <script src="app.js"></script>


</body>

</html>
```
