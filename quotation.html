<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <title>估價單管理</title>

</head>

<body>

    <!-- 估價單管理標題 -->

    <h1>估價單管理</h1>


    <!-- 新增估價單 -->

    <button id="newQuotation">
        ＋ 新增估價單
    </button>


    <!-- 估價單列表 -->

    <h2>所有估價單</h2>

    <table>

        <thead>

            <tr>

                <th>工程名稱</th>

                <th>建立日期</th>

                <th>地址</th>

                <th>操作</th>

            </tr>

        </thead>

        <tbody id="quotationTable">

        </tbody>

    </table>


    <script>

        // =========================
        // Supabase 設定
        // =========================

        // Supabase 專案網址
        const SUPABASE_URL =
            "https://ilplovmomqblgqopihce.supabase.co";


        // Supabase 公開 anon key
        // 請貼上你目前 material.js 使用的 anon public key
        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscGxvdm1vbXFibGdxb3BpaGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzMxMjEsImV4cCI6MjEwNjYwOTEyMX0.GzszzXgUmF_Jq2dDH9QI61zUGuiy968ufzZM3H2qGoU";


        // quotations 資料表 API
        const QUOTATIONS_API =
            SUPABASE_URL +
            "/rest/v1/quotations";


        // =========================
        // 建立 Supabase API 標頭
        // =========================

        function getHeaders() {

            return {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json"

            };

        }


        // =========================
        // 取得 HTML 元素
        // =========================

        // 取得估價單表格
        const quotationTable =
            document.getElementById(
                "quotationTable"
            );


        // 取得新增估價單按鈕
        const newQuotationButton =
            document.getElementById(
                "newQuotation"
            );


        // =========================
        // 從 Supabase 取得所有估價單
        // =========================

        async function loadQuotations() {

            try {

                // 向 Supabase 要求所有估價單
                const response =
                    await fetch(
                        QUOTATIONS_API +
                        "?select=*&order=id.desc",
                        {

                            method: "GET",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果取得資料失敗
                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "取得估價單失敗：",
                        errorText
                    );

                    alert(
                        "取得估價單失敗！"
                    );

                    return;

                }


                // 將 Supabase 回傳的 JSON 轉成資料
                const quotations =
                    await response.json();


                // 顯示估價單
                displayQuotations(
                    quotations
                );


            }
            catch (error) {

                console.error(
                    "取得估價單發生錯誤：",
                    error
                );

                alert(
                    "無法連線到 Supabase！"
                );

            }

        }


        // =========================
        // 顯示估價單
        // =========================

        function displayQuotations(
            quotations
        ) {

            // 清空列表
            quotationTable.innerHTML =
                "";


            // 如果沒有估價單
            if (
                quotations.length === 0
            ) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td colspan="4">

                        目前沒有估價單

                    </td>

                `;


                quotationTable.appendChild(
                    row
                );

                return;

            }


            // 一筆一筆顯示估價單
            quotations.forEach(
                function(quotation) {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${quotation.project_name || ""}
                        </td>

                        <td>
                            ${quotation.project_date || ""}
                        </td>

                        <td>
                            ${quotation.project_address || ""}
                        </td>

                        <td>

                            <button
                                onclick="openQuotation(${quotation.id})"
                            >
                                開啟
                            </button>

                            <button
                                onclick="deleteQuotation(${quotation.id})"
                            >
                                刪除
                            </button>

                        </td>

                    `;


                    quotationTable.appendChild(
                        row
                    );

                }
            );

        }


        // =========================
        // 新增估價單
        // =========================

        newQuotationButton.addEventListener(
            "click",
            async function() {

                // 請使用者輸入工程名稱
                const name =
                    prompt(
                        "請輸入工程名稱"
                    );


                // 如果沒有輸入
                if (!name) {

                    return;

                }


                try {

                    // 建立今天日期
                    const today =
                        new Date()
                            .toISOString()
                            .split("T")[0];


                    // 建立新的估價單資料
                    const quotationData = {

                        // 工程名稱
                        project_name:
                            name,

                        // 建立日期
                        project_date:
                            today,

                        // 初始地址
                        project_address:
                            ""

                    };


                    // =========================
                    // 將估價單新增到 Supabase
                    // =========================

                    const response =
                        await fetch(
                            QUOTATIONS_API,
                            {

                                method: "POST",

                                // 要求 Supabase
                                // 回傳新建立的資料
                                headers: {

                                    ...getHeaders(),

                                    "Prefer":
                                        "return=representation"

                                },

                                body:
                                    JSON.stringify(
                                        quotationData
                                    )

                            }
                        );


                    // 如果新增失敗
                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(
                            "新增估價單失敗：",
                            errorText
                        );

                        alert(
                            "新增估價單失敗！"
                        );

                        return;

                    }


                    // =========================
                    // 取得 Supabase 建立的估價單
                    // =========================

                    const createdQuotation =
                        await response.json();


                    // =========================
                    // 確認 Supabase 有回傳資料
                    // =========================

                    if (
                        !createdQuotation ||
                        createdQuotation.length === 0
                    ) {

                        console.error(
                            "Supabase 沒有回傳新估價單資料"
                        );

                        alert(
                            "估價單建立成功，但沒有取得估價單 ID！"
                        );

                        return;

                    }


                    // =========================
                    // 取得建立完成的估價單 ID
                    // =========================

                    const quotationId =
                        createdQuotation[0].id;


                    // =========================
                    // 將目前估價單 ID
                    // 存到瀏覽器
                    // =========================

                    localStorage.setItem(
                        "currentQuotationId",
                        quotationId
                    );


                    // =========================
                    // 前往估價單
                    // =========================

                    window.location.href =
                        "index.html";


                }
                catch (error) {

                    console.error(
                        "新增估價單發生錯誤：",
                        error
                    );

                    alert(
                        "無法連線到 Supabase！"
                    );

                }

            }
        );


        // =========================
        // 開啟估價單
        // =========================

        function openQuotation(
            quotationId
        ) {

            // 把目前估價單 ID
            // 存到瀏覽器
            localStorage.setItem(
                "currentQuotationId",
                quotationId
            );


            // 前往估價單
            window.location.href =
                "index.html";

        }


        // =========================
        // 刪除估價單
        // =========================

        async function deleteQuotation(
            quotationId
        ) {

            // 確認是否刪除
            const confirmDelete =
                confirm(
                    "確定要刪除這張估價單嗎？"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                // =========================
                // 先刪除估價單材料
                // =========================

                const quotationItemsApi =
                    SUPABASE_URL +
                    "/rest/v1/quotation_items";


                const deleteItemsResponse =
                    await fetch(
                        quotationItemsApi +
                        "?quotation_id=eq." +
                        quotationId,
                        {

                            method: "DELETE",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果刪除材料失敗
                if (
                    !deleteItemsResponse.ok
                ) {

                    const errorText =
                        await deleteItemsResponse.text();

                    console.error(
                        "刪除估價單材料失敗：",
                        errorText
                    );

                    alert(
                        "刪除估價單材料失敗！"
                    );

                    return;

                }


                // =========================
                // 再刪除估價單
                // =========================

                const response =
                    await fetch(
                        QUOTATIONS_API +
                        "?id=eq." +
                        quotationId,
                        {

                            method: "DELETE",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果刪除估價單失敗
                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "刪除估價單失敗：",
                        errorText
                    );

                    alert(
                        "刪除估價單失敗！"
                    );

                    return;

                }


                // =========================
                // 如果刪除的是目前估價單
                // =========================

                const currentQuotationId =
                    localStorage.getItem(
                        "currentQuotationId"
                    );


                if (
                    currentQuotationId ===
                    String(quotationId)
                ) {

                    // 清除目前估價單 ID
                    localStorage.removeItem(
                        "currentQuotationId"
                    );

                }


                // =========================
                // 重新載入估價單
                // =========================

                loadQuotations();


            }
            catch (error) {

                console.error(
                    "刪除估價單發生錯誤：",
                    error
                );

                alert(
                    "無法連線到 Supabase！"
                );

            }

        }


        // =========================
        // 網頁載入時
        // =========================

        loadQuotations();

    </script>

</body>

</html>
