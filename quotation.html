```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <title>估價單管理</title>


    <style>

        /* =========================
           整個網頁
           ========================= */

        body {

            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;

            background-color: #f5f5f5;

            margin: 0;

            padding: 30px;

        }


        /* =========================
           標題
           ========================= */

        h1 {

            text-align: center;

        }


        /* =========================
           搜尋區域
           ========================= */

        .search-area {

            background-color: white;

            padding: 20px;

            margin-top: 20px;

            margin-bottom: 20px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);

        }


        /* 搜尋輸入框 */

        #searchQuotation {

            width: 100%;

            padding: 10px;

            font-size: 16px;

            box-sizing: border-box;

        }


        /* =========================
           按鈕
           ========================= */

        button {

            padding: 8px 15px;

            font-size: 15px;

            cursor: pointer;

            margin-right: 5px;

        }


        /* =========================
           新增估價單按鈕
           ========================= */

        #newQuotation {

            margin-top: 10px;

            padding: 10px 20px;

            font-size: 16px;

        }


        /* =========================
           估價單表格
           ========================= */

        table {

            width: 100%;

            border-collapse: collapse;

            background-color: white;

        }


        /* 表格框線 */

        th,
        td {

            border: 1px solid #999;

            padding: 10px;

            text-align: center;

        }


        /* 表頭 */

        th {

            background-color: #eeeeee;

        }


        /* =========================
           搜尋結果數量
           ========================= */

        #searchResultCount {

            margin-top: 10px;

            color: #666;

        }

    </style>

</head>


<body>


    <!-- 估價單管理標題 -->

    <h1>估價單管理</h1>


    <!-- 新增估價單 -->

    <button id="newQuotation">
        ＋ 新增估價單
    </button>


    <!-- =========================
         搜尋估價單
         ========================= -->

    <div class="search-area">

        <h2>
            🔍 搜尋估價單
        </h2>


        <!-- 搜尋輸入框 -->

        <input
            type="text"
            id="searchQuotation"
            placeholder="請輸入工程名稱或地址"
        >


        <!-- 搜尋結果數量 -->

        <div id="searchResultCount">

            共 0 張估價單

        </div>

    </div>


    <!-- 估價單列表 -->

    <h2>所有估價單</h2>


    <table>

        <thead>

            <tr>

                <th>工程名稱</th>

                <th>建立日期</th>

                <th>地址</th>

                <th>操作</th>

            </tr>

        </thead>


        <tbody id="quotationTable">

        </tbody>

    </table>


    <script>


        // =========================
        // Supabase 設定
        // =========================

        // Supabase 專案網址
        const SUPABASE_URL =
            "https://ilplovmomqblgqopihce.supabase.co";


        // Supabase 公開 anon key
        // 這裡使用你目前 quotation.html
        // 已經可以正常使用的 anon public key
        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscGxvdm1vbXFibGdxb3BpaGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzMxMjEsImV4cCI6MjEwNjYwOTEyMX0.GzszzXgUmF_Jq2dDH9QI61zUGuiy968ufzZM3H2qGoU";


        // quotations 資料表 API
        const QUOTATIONS_API =
            SUPABASE_URL +
            "/rest/v1/quotations";


        // quotation_items 資料表 API
        const QUOTATION_ITEMS_API =
            SUPABASE_URL +
            "/rest/v1/quotation_items";


        // =========================
        // 儲存目前所有估價單
        // =========================

        let quotations = [];


        // =========================
        // 建立 Supabase API 標頭
        // =========================

        function getHeaders() {

            return {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json"

            };

        }


        // =========================
        // 取得 HTML 元素
        // =========================

        // 取得估價單表格
        const quotationTable =
            document.getElementById(
                "quotationTable"
            );


        // 取得新增估價單按鈕
        const newQuotationButton =
            document.getElementById(
                "newQuotation"
            );


        // 取得搜尋輸入框
        const searchQuotationInput =
            document.getElementById(
                "searchQuotation"
            );


        // 取得搜尋結果數量
        const searchResultCount =
            document.getElementById(
                "searchResultCount"
            );


        // =========================
        // 從 Supabase 取得所有估價單
        // =========================

        async function loadQuotations() {

            try {

                // 向 Supabase 要求所有估價單
                const response =
                    await fetch(
                        QUOTATIONS_API +
                        "?select=*&order=id.desc",
                        {

                            method: "GET",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果取得資料失敗
                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "取得估價單失敗：",
                        errorText
                    );

                    alert(
                        "取得估價單失敗！"
                    );

                    return;

                }


                // 將 Supabase 回傳的 JSON
                // 轉成 JavaScript 資料
                quotations =
                    await response.json();


                // 顯示估價單
                displayQuotations(
                    quotations
                );

            }


            catch (error) {

                console.error(
                    "取得估價單發生錯誤：",
                    error
                );

                alert(
                    "無法連線到 Supabase！"
                );

            }

        }


        // =========================
        // 顯示估價單
        // =========================

        function displayQuotations(
            quotationList
        ) {

            // 清空列表
            quotationTable.innerHTML =
                "";


            // 更新搜尋結果數量
            searchResultCount.textContent =
                "共 " +
                quotationList.length +
                " 張估價單";


            // 如果沒有估價單
            if (
                quotationList.length === 0
            ) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td colspan="4">

                        找不到符合的估價單

                    </td>

                `;


                quotationTable.appendChild(
                    row
                );

                return;

            }


            // 一筆一筆顯示估價單
            quotationList.forEach(
                function(quotation) {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    // =========================
                    // 建立工程名稱欄位
                    // =========================

                    const nameCell =
                        document.createElement(
                            "td"
                        );

                    nameCell.textContent =
                        quotation.project_name ||
                        "";


                    // =========================
                    // 建立日期欄位
                    // =========================

                    const dateCell =
                        document.createElement(
                            "td"
                        );

                    dateCell.textContent =
                        quotation.project_date ||
                        "";


                    // =========================
                    // 建立地址欄位
                    // =========================

                    const addressCell =
                        document.createElement(
                            "td"
                        );

                    addressCell.textContent =
                        quotation.project_address ||
                        "";


                    // =========================
                    // 建立操作欄位
                    // =========================

                    const operationCell =
                        document.createElement(
                            "td"
                        );


                    // =========================
                    // 建立開啟按鈕
                    // =========================

                    const openButton =
                        document.createElement(
                            "button"
                        );


                    openButton.textContent =
                        "開啟";


                    openButton.addEventListener(
                        "click",
                        function() {

                            openQuotation(
                                quotation.id
                            );

                        }
                    );


                    // =========================
                    // 建立刪除按鈕
                    // =========================

                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.textContent =
                        "刪除";


                    deleteButton.addEventListener(
                        "click",
                        function() {

                            deleteQuotation(
                                quotation.id
                            );

                        }
                    );


                    // =========================
                    // 將按鈕加入操作欄
                    // =========================

                    operationCell.appendChild(
                        openButton
                    );

                    operationCell.appendChild(
                        deleteButton
                    );


                    // =========================
                    // 將欄位加入資料列
                    // =========================

                    row.appendChild(
                        nameCell
                    );

                    row.appendChild(
                        dateCell
                    );

                    row.appendChild(
                        addressCell
                    );

                    row.appendChild(
                        operationCell
                    );


                    // 加入估價單列表
                    quotationTable.appendChild(
                        row
                    );

                }
            );

        }


        // =========================
        // 搜尋估價單
        // =========================

        function searchQuotations() {

            // 取得搜尋文字
            const keyword =
                searchQuotationInput.value
                    .trim()
                    .toLowerCase();


            // =========================
            // 如果沒有輸入搜尋文字
            // 顯示全部估價單
            // =========================

            if (
                keyword === ""
            ) {

                displayQuotations(
                    quotations
                );

                return;

            }


            // =========================
            // 找出符合的估價單
            // =========================

            const results =
                quotations.filter(
                    function(quotation) {

                        // 工程名稱
                        const projectName =
                            (
                                quotation.project_name ||
                                ""
                            )
                            .toLowerCase();


                        // 工程地址
                        const projectAddress =
                            (
                                quotation.project_address ||
                                ""
                            )
                            .toLowerCase();


                        // 工程日期
                        const projectDate =
                            (
                                quotation.project_date ||
                                ""
                            )
                            .toLowerCase();


                        // 搜尋工程名稱
                        // 或地址
                        // 或日期
                        return (
                            projectName.includes(
                                keyword
                            ) ||
                            projectAddress.includes(
                                keyword
                            ) ||
                            projectDate.includes(
                                keyword
                            )
                        );

                    }
                );


            // 顯示搜尋結果
            displayQuotations(
                results
            );

        }


        // =========================
        // 新增估價單
        // =========================

        newQuotationButton.addEventListener(
            "click",
            async function() {

                // 請使用者輸入工程名稱
                const name =
                    prompt(
                        "請輸入工程名稱"
                    );


                // 如果沒有輸入
                if (!name) {

                    return;

                }


                try {

                    // 建立今天日期
                    const today =
                        new Date()
                            .toISOString()
                            .split("T")[0];


                    // 建立新的估價單資料
                    const quotationData = {

                        // 工程名稱
                        project_name:
                            name,

                        // 建立日期
                        project_date:
                            today,

                        // 初始地址
                        project_address:
                            ""

                    };


                    // 將估價單新增到 Supabase
                    const response =
                        await fetch(
                            QUOTATIONS_API,
                            {

                                method: "POST",

                                headers: {

                                    ...getHeaders(),

                                    // 要求 Supabase
                                    // 回傳新增後的資料
                                    "Prefer":
                                        "return=representation"

                                },

                                body:
                                    JSON.stringify(
                                        quotationData
                                    )

                            }
                        );


                    // 如果新增失敗
                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        console.error(
                            "新增估價單失敗：",
                            errorText
                        );

                        alert(
                            "新增估價單失敗！"
                        );

                        return;

                    }


                    // 取得 Supabase 建立的估價單
                    const createdQuotation =
                        await response.json();


                    // 確認 Supabase
                    // 有正確回傳資料
                    if (
                        !createdQuotation ||
                        createdQuotation.length === 0
                    ) {

                        alert(
                            "估價單建立成功，但沒有取得估價單 ID。"
                        );

                        return;

                    }


                    // 取得建立完成的估價單 ID
                    const quotationId =
                        createdQuotation[0].id;


                    // 將目前估價單 ID
                    // 存到瀏覽器
                    localStorage.setItem(
                        "currentQuotationId",
                        quotationId
                    );


                    // 前往估價單
                    window.location.href =
                        "index.html";

                }


                catch (error) {

                    console.error(
                        "新增估價單發生錯誤：",
                        error
                    );

                    alert(
                        "無法連線到 Supabase！"
                    );

                }

            }
        );


        // =========================
        // 搜尋框輸入時
        // =========================

        searchQuotationInput.addEventListener(
            "input",
            function() {

                // 執行搜尋
                searchQuotations();

            }
        );


        // =========================
        // 開啟估價單
        // =========================

        function openQuotation(
            quotationId
        ) {

            // 把目前估價單 ID
            // 存到瀏覽器
            localStorage.setItem(
                "currentQuotationId",
                quotationId
            );


            // 前往估價單
            window.location.href =
                "index.html";

        }


        // =========================
        // 刪除估價單
        // =========================

        async function deleteQuotation(
            quotationId
        ) {

            // 確認是否刪除
            const confirmDelete =
                confirm(
                    "確定要刪除這張估價單嗎？"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                // =========================
                // 先刪除估價單材料
                // =========================

                const deleteItemsResponse =
                    await fetch(
                        QUOTATION_ITEMS_API +
                        "?quotation_id=eq." +
                        quotationId,
                        {

                            method: "DELETE",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果刪除材料失敗
                if (
                    !deleteItemsResponse.ok
                ) {

                    const errorText =
                        await deleteItemsResponse.text();

                    console.error(
                        "刪除估價單材料失敗：",
                        errorText
                    );

                    alert(
                        "刪除估價單材料失敗！"
                    );

                    return;

                }


                // =========================
                // 再刪除估價單
                // =========================

                const response =
                    await fetch(
                        QUOTATIONS_API +
                        "?id=eq." +
                        quotationId,
                        {

                            method: "DELETE",

                            headers:
                                getHeaders()

                        }
                    );


                // 如果刪除失敗
                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "刪除估價單失敗：",
                        errorText
                    );

                    alert(
                        "刪除估價單失敗！"
                    );

                    return;

                }


                // =========================
                // 如果刪除的是目前估價單
                // =========================

                const currentQuotationId =
                    localStorage.getItem(
                        "currentQuotationId"
                    );


                if (
                    currentQuotationId ===
                    String(quotationId)
                ) {

                    // 清除目前估價單 ID
                    localStorage.removeItem(
                        "currentQuotationId"
                    );

                }


                // =========================
                // 重新載入估價單
                // =========================

                await loadQuotations();

            }


            catch (error) {

                console.error(
                    "刪除估價單發生錯誤：",
                    error
                );

                alert(
                    "無法連線到 Supabase！"
                );

            }

        }


        // =========================
        // 網頁載入時
        // =========================

        loadQuotations();


    </script>


</body>

</html>
```
